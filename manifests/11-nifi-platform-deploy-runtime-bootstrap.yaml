apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-deploy-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "64"
data:
  bootstrap_flow.py: |
    import json
    import os
    import re
    import ssl
    import time
    import urllib.error
    import urllib.request
    import uuid

    NIFI_API = os.environ.get("NIFI_API", "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api").rstrip("/")
    FLOW_NAME = os.environ.get("NIFI_FLOW_NAME", "platform-app-deploy")
    CERT_DIR = os.environ.get("NIFI_TLS_DIR", "/nifi-tls")
    KAFKA_CREDENTIALS_DIR = os.environ.get("KAFKA_CREDENTIALS_DIR", "/kafka-credentials")
    KAFKA_BOOTSTRAP_SERVERS = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "kafka.kafka.svc.internal.lan:9092")
    KAFKA_SECURITY_PROTOCOL = os.environ.get("KAFKA_SECURITY_PROTOCOL", "SASL_PLAINTEXT")
    KAFKA_SASL_MECHANISM = os.environ.get("KAFKA_SASL_MECHANISM", "SCRAM-SHA-256")
    FLOW_SECRETS_DIR = os.environ.get("FLOW_SECRETS_DIR", "/flow-secrets")
    PLATFORM_DEPLOY_PREPARED_TOPIC = os.environ.get("PLATFORM_DEPLOY_PREPARED_TOPIC", "batch.platform.deploy.prepared.v1")
    PLATFORM_DEPLOY_DLQ_TOPIC = os.environ.get("PLATFORM_DEPLOY_DLQ_TOPIC", "batch.platform.deploy.prepared.dlq.v1")
    PLATFORM_DEPLOY_CONSUMER_GROUP = os.environ.get("PLATFORM_DEPLOY_CONSUMER_GROUP", "nifi-platform-deploy-prepared-v1")
    PLATFORM_DEPLOY_SERVICE_URL = os.environ.get("PLATFORM_DEPLOY_SERVICE_URL", "http://platform-deploy-service.directus.svc.cluster.local:8080").rstrip("/")
    PLATFORM_DEPLOY_EXECUTOR_URL = os.environ.get("PLATFORM_DEPLOY_EXECUTOR_URL", "http://platform-deploy-executor.directus.svc.cluster.local:8080").rstrip("/")
    PLATFORM_DEPLOY_EXECUTION_ENABLED = os.environ.get("PLATFORM_DEPLOY_EXECUTION_ENABLED", "false").strip().lower() in ("1", "true", "yes", "on")
    PARAMETER_CONTEXT_NAME = os.environ.get("NIFI_PARAMETER_CONTEXT_NAME", "platform-deploy-context")
    CLIENT_ID = str(uuid.uuid4())

    CONTEXT = ssl.create_default_context(cafile=os.path.join(CERT_DIR, "ca.crt"))
    CONTEXT.load_cert_chain(
      certfile=os.path.join(CERT_DIR, "tls.crt"),
      keyfile=os.path.join(CERT_DIR, "tls.key"),
    )

    def api(method, path, payload=None, timeout=60):
      data = None
      headers = {"Accept": "application/json"}
      if payload is not None:
        data = json.dumps(payload).encode("utf-8")
        headers["Content-Type"] = "application/json"
      request = urllib.request.Request(f"{NIFI_API}{path}", data=data, headers=headers, method=method)
      try:
        with urllib.request.urlopen(request, context=CONTEXT, timeout=timeout) as response:
          body = response.read().decode("utf-8")
          return json.loads(body) if body else {}
      except urllib.error.HTTPError as exc:
        body = exc.read().decode("utf-8", errors="replace")
        raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {body}") from exc

    def revision(entity):
      return {
        "clientId": CLIENT_ID,
        "version": entity["revision"]["version"],
      }

    def read_secret_file(directory, name):
      with open(os.path.join(directory, name), "r", encoding="utf-8") as secret_file:
        return secret_file.read().strip()

    def read_kafka_secret(name):
      return read_secret_file(KAFKA_CREDENTIALS_DIR, name)

    def read_flow_secret(name):
      return read_secret_file(FLOW_SECRETS_DIR, name)

    def norm(value):
      return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

    def descriptor_key(descriptors, candidates):
      wanted = {norm(candidate) for candidate in candidates}
      for key, descriptor in descriptors.items():
        names = [key, descriptor.get("name"), descriptor.get("displayName")]
        if any(norm(name) in wanted for name in names):
          return key
      available = ", ".join(sorted(descriptors.keys()))
      raise RuntimeError(f"Could not find descriptor {candidates}; available: {available}")

    def wait_for_cluster():
      last_error = None
      for _ in range(120):
        try:
          cluster = api("GET", "/controller/cluster", timeout=20).get("cluster", {})
          nodes = cluster.get("nodes", [])
          if nodes and all(node.get("status") == "CONNECTED" for node in nodes):
            return
        except Exception as exc:
          last_error = exc
        time.sleep(5)
      raise RuntimeError(f"NiFi cluster was not ready: {last_error}")

    def find_process_group():
      root = api("GET", "/flow/process-groups/root", timeout=30).get("processGroupFlow", {})
      for process_group in root.get("flow", {}).get("processGroups", []):
        component = process_group.get("component", {})
        if component.get("name") == FLOW_NAME:
          return component["id"]
      return ""

    def ensure_process_group():
      for _ in range(180):
        process_group_id = find_process_group()
        if process_group_id:
          return process_group_id
        created = api(
          "POST",
          "/process-groups/root/process-groups",
          {
            "revision": {"clientId": CLIENT_ID, "version": 0},
            "component": {
              "name": FLOW_NAME,
              "position": {"x": 800, "y": 0},
            },
          },
        )
        component = created.get("component", {})
        if component.get("id"):
          return component["id"]
        time.sleep(5)
      raise RuntimeError(f"Process group {FLOW_NAME} could not be created under root.")

    def find_parameter_context():
      for parameter_context in api("GET", "/flow/parameter-contexts").get("parameterContexts", []):
        component = parameter_context.get("component", {})
        if component.get("name") == PARAMETER_CONTEXT_NAME:
          return parameter_context
      raise RuntimeError(f"Parameter context {PARAMETER_CONTEXT_NAME} was not found.")

    def ensure_process_group_parameter_context(process_group_id):
      parameter_context = find_parameter_context()
      last_error = None
      for _ in range(60):
        process_group = api("GET", f"/process-groups/{process_group_id}")
        component = process_group["component"]
        current_context = component.get("parameterContext") or {}
        if current_context.get("id") == parameter_context["id"]:
          return
        try:
          api(
            "PUT",
            f"/process-groups/{process_group_id}",
            {
              "revision": revision(process_group),
              "component": {
                "id": process_group_id,
                "name": component.get("name", FLOW_NAME),
                "position": component.get("position", {"x": 800, "y": 0}),
                "parameterContext": {"id": parameter_context["id"]},
              },
            },
          )
          return
        except RuntimeError as exc:
          last_error = exc
          if "HTTP 409" not in str(exc):
            raise
          for processor in list_processors(process_group_id):
            set_processor_state(processor, "STOPPED")
          time.sleep(1)
      if last_error:
        raise last_error
      raise RuntimeError(f"Process group {FLOW_NAME} could not be assigned parameter context {PARAMETER_CONTEXT_NAME}.")

    def list_processors(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/processors").get("processors", [])

    def list_connections(process_group_id):
      return api("GET", f"/process-groups/{process_group_id}/connections").get("connections", [])

    def list_controller_services(process_group_id):
      return api("GET", f"/flow/process-groups/{process_group_id}/controller-services").get("controllerServices", [])

    def find_by_name(entities, name):
      for entity in entities:
        if entity.get("component", {}).get("name") == name:
          return entity
      return None

    def ensure_controller_service(process_group_id):
      existing = find_by_name(list_controller_services(process_group_id), "platform-deploy-kafka-connection")
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/controller-services",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": "platform-deploy-kafka-connection",
            "type": "org.apache.nifi.kafka.service.Kafka3ConnectionService",
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": "nifi-kafka-3-service-nar",
              "version": "2.7.1",
            },
          },
        },
      )

    def ensure_processor(process_group_id, name, processor_type, artifact, x, y):
      existing = find_by_name(list_processors(process_group_id), name)
      if existing:
        return existing
      return api(
        "POST",
        f"/process-groups/{process_group_id}/processors",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "type": processor_type,
            "bundle": {
              "group": "org.apache.nifi",
              "artifact": artifact,
              "version": "2.7.1",
            },
            "position": {"x": x, "y": y},
          },
        },
      )

    def configure_controller_service(entity, property_specs):
      entity = api("GET", f"/controller-services/{entity['id']}")
      component = entity["component"]
      descriptors = component.get("descriptors", {})
      properties = dict(component.get("properties") or {})
      for candidates, value in property_specs:
        properties[descriptor_key(descriptors, candidates)] = value
      return api(
        "PUT",
        f"/controller-services/{entity['id']}",
        {
          "revision": revision(entity),
          "component": {
            "id": entity["id"],
            "properties": properties,
          },
        },
      )

    def controller_service_has_properties(entity, property_specs):
      entity = api("GET", f"/controller-services/{entity['id']}")
      component = entity["component"]
      descriptors = component.get("descriptors", {})
      properties = component.get("properties") or {}
      for candidates, value in property_specs:
        if properties.get(descriptor_key(descriptors, candidates)) != value:
          return False
      return True

    def configure_processor(entity, property_specs, auto_terminated=None, dynamic_property_specs=None):
      last_error = None
      for _ in range(60):
        entity = api("GET", f"/processors/{entity['id']}")
        config = entity["component"].get("config", {})
        descriptors = config.get("descriptors", {})
        properties = dict(config.get("properties") or {})
        desired_properties = dict(properties)
        for candidates, value in property_specs:
          desired_properties[descriptor_key(descriptors, candidates)] = value
        for name, value in dynamic_property_specs or []:
          desired_properties[name] = value

        properties_match = all(properties.get(key) == value for key, value in desired_properties.items())
        relationships_match = True
        if auto_terminated is not None:
          relationships_match = sorted(config.get("autoTerminatedRelationships") or []) == sorted(auto_terminated)
        if properties_match and relationships_match:
          return entity

        if entity["component"].get("state") == "RUNNING":
          set_processor_state(entity, "STOPPED")
          time.sleep(1)
          continue

        new_config = {"properties": desired_properties}
        if auto_terminated is not None:
          new_config["autoTerminatedRelationships"] = auto_terminated
        try:
          return api(
            "PUT",
            f"/processors/{entity['id']}",
            {
              "revision": revision(entity),
              "component": {
                "id": entity["id"],
                "config": new_config,
              },
            },
          )
        except RuntimeError as exc:
          last_error = exc
          if "HTTP 409" not in str(exc):
            raise
          time.sleep(1)
      raise last_error

    def set_processor_state(entity, state):
      last_error = None
      transition_state = {"RUNNING": "STARTING", "STOPPED": "STOPPING"}.get(state)
      for _ in range(120):
        entity = api("GET", f"/processors/{entity['id']}")
        component = entity["component"]
        current_state = component.get("state")
        physical_state = component.get("physicalState") or current_state
        if current_state == state and physical_state == state:
          return entity
        if physical_state == transition_state:
          time.sleep(1)
          continue
        try:
          api(
            "PUT",
            f"/processors/{entity['id']}/run-status",
            {
              "revision": revision(entity),
              "state": state,
              "disconnectedNodeAcknowledged": False,
            },
          )
        except RuntimeError as exc:
          last_error = exc
          if "HTTP 409" not in str(exc):
            raise
        time.sleep(1)
      if last_error:
        raise last_error
      raise RuntimeError(f"Processor {entity['component']['name']} did not reach {state}.")

    def set_controller_service_state(entity, state):
      entity = api("GET", f"/controller-services/{entity['id']}")
      if entity["component"].get("state") == state:
        return entity
      last_error = None
      for _ in range(60):
        entity = api("GET", f"/controller-services/{entity['id']}")
        if entity["component"].get("state") == state:
          return entity
        try:
          api(
            "PUT",
            f"/controller-services/{entity['id']}/run-status",
            {
              "revision": revision(entity),
              "state": state,
              "disconnectedNodeAcknowledged": False,
            },
          )
          break
        except RuntimeError as exc:
          last_error = exc
          if "HTTP 409" not in str(exc):
            raise
          time.sleep(1)
      else:
        raise last_error
      for _ in range(60):
        current = api("GET", f"/controller-services/{entity['id']}")
        if current["component"].get("state") == state:
          return current
        time.sleep(1)
      raise RuntimeError(f"Controller service {entity['component']['name']} did not reach {state}.")

    def ensure_connection(process_group_id, name, source_id, destination_id, relationships):
      for connection in list_connections(process_group_id):
        component = connection.get("component", {})
        if component.get("name") == name:
          current_source = component.get("source", {})
          current_destination = component.get("destination", {})
          current_relationships = sorted(component.get("selectedRelationships") or [])
          if (
            current_source.get("id") != source_id
            or current_destination.get("id") != destination_id
            or current_relationships != sorted(relationships)
          ):
            api(
              "DELETE",
              f"/connections/{connection['id']}?version={connection['revision']['version']}&clientId={CLIENT_ID}",
            )
            break
          return connection
      else:
        connection = None
      if connection and connection.get("component", {}).get("name") == name:
        return connection
      return api(
        "POST",
        f"/process-groups/{process_group_id}/connections",
        {
          "revision": {"clientId": CLIENT_ID, "version": 0},
          "component": {
            "name": name,
            "source": {
              "id": source_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "destination": {
              "id": destination_id,
              "groupId": process_group_id,
              "type": "PROCESSOR",
            },
            "selectedRelationships": relationships,
            "flowFileExpiration": "0 sec",
            "backPressureObjectThreshold": 10000,
            "backPressureDataSizeThreshold": "1 GB",
          },
        },
      )

    def delete_connection_by_name(process_group_id, name):
      for connection in list_connections(process_group_id):
        if connection.get("component", {}).get("name") == name:
          api(
            "DELETE",
            f"/connections/{connection['id']}?version={connection['revision']['version']}&clientId={CLIENT_ID}",
          )

    def delete_processor_by_name(process_group_id, name):
      processor = find_by_name(list_processors(process_group_id), name)
      if not processor:
        return
      processor = set_processor_state(processor, "STOPPED")
      api(
        "DELETE",
        f"/processors/{processor['id']}?version={processor['revision']['version']}&clientId={CLIENT_ID}",
      )

    def remove_stale_flink_submit_path(process_group_id):
      for processor in list_processors(process_group_id):
        set_processor_state(processor, "STOPPED")
      for connection_name in (
        "running-original-to-build-flink-run-request",
        "flink-request-to-submit-platform-deploy-job",
        "flink-request-failures-to-platform-deploy-dlq",
        "flink-submit-failures-to-platform-deploy-dlq",
        "running-failures-to-platform-deploy-dlq",
        "running-original-to-route-platform-operation",
        "prod-destroy-to-success-callback",
      ):
        delete_connection_by_name(process_group_id, connection_name)
      for processor_name in (
        "submit-platform-deploy-flink-job",
        "build-platform-flink-run-request",
      ):
        delete_processor_by_name(process_group_id, processor_name)

    def main():
      wait_for_cluster()
      process_group_id = ensure_process_group()
      remove_stale_flink_submit_path(process_group_id)

      kafka_service = ensure_controller_service(process_group_id)
      consume = ensure_processor(
        process_group_id,
        "consume-platform-deploy-requests",
        "org.apache.nifi.kafka.processors.ConsumeKafka",
        "nifi-kafka-nar",
        0,
        0,
      )
      extract_metadata = ensure_processor(
        process_group_id,
        "extract-platform-deploy-metadata",
        "org.apache.nifi.processors.standard.EvaluateJsonPath",
        "nifi-standard-nar",
        300,
        0,
      )
      set_auth = ensure_processor(
        process_group_id,
        "set-platform-deploy-authorization",
        "org.apache.nifi.processors.attributes.UpdateAttribute",
        "nifi-update-attribute-nar",
        600,
        0,
      )
      mark_running = ensure_processor(
        process_group_id,
        "mark-platform-operation-running",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        900,
        0,
      )
      route_operation_type = ensure_processor(
        process_group_id,
        "route-platform-operation-type",
        "org.apache.nifi.processors.standard.RouteOnAttribute",
        "nifi-standard-nar",
        1200,
        0,
      )
      prod_deploy = ensure_processor(
        process_group_id,
        "invoke-platform-prod-deploy",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        1500,
        -180,
      )
      preview_deploy = ensure_processor(
        process_group_id,
        "invoke-platform-preview-deploy",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        1800,
        -180,
      )
      preview_destroy = ensure_processor(
        process_group_id,
        "invoke-platform-preview-destroy",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        1500,
        180,
      )
      prod_destroy = ensure_processor(
        process_group_id,
        "invoke-platform-prod-destroy",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        1800,
        180,
      )
      route_after_destroy = ensure_processor(
        process_group_id,
        "route-platform-after-destroy",
        "org.apache.nifi.processors.standard.RouteOnAttribute",
        "nifi-standard-nar",
        2100,
        180,
      )
      build_success_callback = ensure_processor(
        process_group_id,
        "build-platform-deploy-success-callback",
        "org.apache.nifi.processors.standard.ReplaceText",
        "nifi-standard-nar",
        2400,
        0,
      )
      finish_succeeded = ensure_processor(
        process_group_id,
        "finish-platform-operation-succeeded",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        2700,
        0,
      )
      build_failure_callback = ensure_processor(
        process_group_id,
        "build-platform-deploy-failure-callback",
        "org.apache.nifi.processors.standard.ReplaceText",
        "nifi-standard-nar",
        1800,
        460,
      )
      finish_failed = ensure_processor(
        process_group_id,
        "finish-platform-operation-failed",
        "org.apache.nifi.processors.standard.InvokeHTTP",
        "nifi-standard-nar",
        2100,
        460,
      )
      dlq = ensure_processor(
        process_group_id,
        "publish-platform-deploy-dlq",
        "org.apache.nifi.kafka.processors.PublishKafka",
        "nifi-kafka-nar",
        2400,
        460,
      )

      processors = (
        consume,
        extract_metadata,
        set_auth,
        mark_running,
        route_operation_type,
        prod_deploy,
        preview_deploy,
        preview_destroy,
        prod_destroy,
        route_after_destroy,
        build_success_callback,
        finish_succeeded,
        build_failure_callback,
        finish_failed,
        dlq,
      )

      for processor in processors:
        set_processor_state(processor, "STOPPED")
      set_auth = configure_processor(
        set_auth,
        [],
        None,
        [
          ("Authorization", f"Bearer {read_flow_secret('platform_deploy_service_token')}"),
          ("platform.execution_enabled", "true" if PLATFORM_DEPLOY_EXECUTION_ENABLED else "false"),
        ],
      )
      set_controller_service_state(kafka_service, "DISABLED")
      ensure_process_group_parameter_context(process_group_id)

      kafka_service_match_properties = [
        (["bootstrap.servers", "Bootstrap Servers"], KAFKA_BOOTSTRAP_SERVERS),
        (["security.protocol", "Security Protocol"], KAFKA_SECURITY_PROTOCOL),
        (["sasl.mechanism", "SASL Mechanism"], KAFKA_SASL_MECHANISM),
        (["sasl.username", "SASL Username"], read_kafka_secret("nifi_username")),
      ]
      kafka_service_properties = kafka_service_match_properties + [
        (["sasl.password", "SASL Password"], "#{nifi_password}"),
      ]
      kafka_service = api("GET", f"/controller-services/{kafka_service['id']}")
      if (
        kafka_service["component"].get("state") != "ENABLED"
        or not controller_service_has_properties(kafka_service, kafka_service_match_properties)
      ):
        set_controller_service_state(kafka_service, "DISABLED")
        kafka_service = configure_controller_service(kafka_service, kafka_service_properties)
        kafka_service = set_controller_service_state(kafka_service, "ENABLED")

      consume = configure_processor(
        consume,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Group ID"], PLATFORM_DEPLOY_CONSUMER_GROUP),
          (["Topics"], PLATFORM_DEPLOY_PREPARED_TOPIC),
          (["auto.offset.reset", "Auto Offset Reset"], "earliest"),
        ],
      )
      extract_metadata = configure_processor(
        extract_metadata,
        [
          (["Destination"], "flowfile-attribute"),
          (["Return Type"], "auto-detect"),
          (["Path Not Found Behavior"], "ignore"),
          (["Null Value Representation"], "empty string"),
        ],
        None,
        [
          ("platform.operation_id", "$.operation_id"),
          ("platform.app_id", "$.app_id"),
          ("platform.app_key", "$.app_key"),
          ("platform.operation_type", "$.operation_type"),
          ("platform.sequence", "$.sequence"),
          ("platform.site_key", "$.site_key"),
          ("platform.keycloak_realm", "$.keycloak_realm"),
          ("platform.deployment_strategy", "$.deployment_strategy"),
          ("platform.prepared_at", "$.prepared_at"),
          ("platform.prepared_by", "$.prepared_by"),
        ],
      )
      set_auth = configure_processor(
        set_auth,
        [],
        None,
        [
          ("Authorization", f"Bearer {read_flow_secret('platform_deploy_service_token')}"),
          ("platform.execution_enabled", "true" if PLATFORM_DEPLOY_EXECUTION_ENABLED else "false"),
        ],
      )
      mark_running = configure_processor(
        mark_running,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_SERVICE_URL}/internal/operations/${{platform.operation_id}}/start"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response"] if PLATFORM_DEPLOY_EXECUTION_ENABLED else ["Original", "Response"],
      )
      route_operation_type = configure_processor(
        route_operation_type,
        [
          (["Routing Strategy"], "Route to Property name"),
        ],
        None,
        [
          ("destroy", "${platform.sequence:equals('destroy')}"),
          ("recreate", "${platform.sequence:equals('recreate')}"),
        ],
      )
      prod_deploy = configure_processor(
        prod_deploy,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_EXECUTOR_URL}/internal/operations/${{platform.operation_id}}/steps/prod-deploy"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "1800 sec"),
        ],
        ["Response"],
      )
      preview_deploy = configure_processor(
        preview_deploy,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_EXECUTOR_URL}/internal/operations/${{platform.operation_id}}/steps/preview-deploy"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "1800 sec"),
        ],
        ["Response"],
      )
      preview_destroy = configure_processor(
        preview_destroy,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_EXECUTOR_URL}/internal/operations/${{platform.operation_id}}/steps/preview-destroy"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "1800 sec"),
        ],
        ["Response"],
      )
      prod_destroy = configure_processor(
        prod_destroy,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_EXECUTOR_URL}/internal/operations/${{platform.operation_id}}/steps/prod-destroy"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "1800 sec"),
        ],
        ["Response"],
      )
      route_after_destroy = configure_processor(
        route_after_destroy,
        [
          (["Routing Strategy"], "Route to Property name"),
        ],
        None,
        [("destroy_complete", "${platform.sequence:equals('destroy')}")],
      )
      build_success_callback = configure_processor(
        build_success_callback,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"status\":\"succeeded\",\"app_id\":\"${platform.app_id:escapeJson()}\",\"result_json\":{\"completed_by\":\"nifi-platform-deploy-flow\",\"operation_type\":\"${platform.operation_type:escapeJson()}\",\"sequence\":\"${platform.sequence:escapeJson()}\"}}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
        None,
      )
      finish_succeeded = configure_processor(
        finish_succeeded,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_SERVICE_URL}/internal/operations/${{platform.operation_id}}/finish"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Original", "Response"],
      )
      build_failure_callback = configure_processor(
        build_failure_callback,
        [
          (["Replacement Strategy"], "Always Replace"),
          (
            ["Replacement Value"],
            "{\"status\":\"failed\",\"app_id\":\"${platform.app_id:escapeJson()}\",\"error_message\":\"Platform deploy orchestration failed in NiFi before completion or execution is disabled.\",\"log_excerpt\":\"See NiFi bulletin and platform deploy DLQ for the failed flowfile.\",\"result_json\":{\"failed_by\":\"nifi-platform-deploy-flow\",\"operation_type\":\"${platform.operation_type:escapeJson()}\",\"sequence\":\"${platform.sequence:escapeJson()}\",\"execution_enabled\":\"${platform.execution_enabled:escapeJson()}\"}}",
          ),
          (["Evaluation Mode"], "Entire text"),
        ],
        None,
      )
      finish_failed = configure_processor(
        finish_failed,
        [
          (["HTTP Method"], "POST"),
          (["HTTP URL", "Remote URL"], f"{PLATFORM_DEPLOY_SERVICE_URL}/internal/operations/${{platform.operation_id}}/finish"),
          (["Request Body Enabled", "Send Message Body"], "true"),
          (["Request Content-Type", "Content-Type"], "application/json"),
          (["Request Header Attributes Pattern"], "Authorization"),
          (["Response Generation Required", "Always Output Response"], "true"),
          (["Socket Read Timeout"], "60 sec"),
        ],
        ["Response"],
      )
      dlq = configure_processor(
        dlq,
        [
          (["Kafka Connection Service"], kafka_service["id"]),
          (["Topic Name", "Topic"], PLATFORM_DEPLOY_DLQ_TOPIC),
        ],
        ["success", "failure"],
      )

      ensure_connection(process_group_id, "consume-to-extract-platform-deploy-metadata", consume["id"], extract_metadata["id"], ["success"])
      ensure_connection(process_group_id, "metadata-to-set-platform-deploy-auth", extract_metadata["id"], set_auth["id"], ["matched"])
      ensure_connection(process_group_id, "metadata-failures-to-platform-deploy-dlq", extract_metadata["id"], dlq["id"], ["failure", "unmatched"])
      ensure_connection(process_group_id, "auth-to-mark-platform-operation-running", set_auth["id"], mark_running["id"], ["success"])
      ensure_connection(process_group_id, "running-failures-to-platform-deploy-dlq", mark_running["id"], dlq["id"], ["Failure", "No Retry", "Retry"])

      if PLATFORM_DEPLOY_EXECUTION_ENABLED:
        ensure_connection(process_group_id, "running-original-to-route-platform-operation", mark_running["id"], route_operation_type["id"], ["Original"])
        ensure_connection(process_group_id, "deploy-route-to-prod-deploy", route_operation_type["id"], prod_deploy["id"], ["unmatched"])
        ensure_connection(process_group_id, "recreate-route-to-preview-destroy", route_operation_type["id"], preview_destroy["id"], ["recreate"])
        ensure_connection(process_group_id, "destroy-route-to-preview-destroy", route_operation_type["id"], preview_destroy["id"], ["destroy"])
        ensure_connection(process_group_id, "prod-deploy-to-preview-deploy", prod_deploy["id"], preview_deploy["id"], ["Original"])
        ensure_connection(process_group_id, "preview-deploy-to-success-callback", preview_deploy["id"], build_success_callback["id"], ["Original"])
        ensure_connection(process_group_id, "preview-destroy-to-prod-destroy", preview_destroy["id"], prod_destroy["id"], ["Original"])
        ensure_connection(process_group_id, "prod-destroy-to-route-after-destroy", prod_destroy["id"], route_after_destroy["id"], ["Original"])
        ensure_connection(process_group_id, "destroy-complete-to-success-callback", route_after_destroy["id"], build_success_callback["id"], ["destroy_complete"])
        ensure_connection(process_group_id, "recreate-after-destroy-to-prod-deploy", route_after_destroy["id"], prod_deploy["id"], ["unmatched"])
        ensure_connection(process_group_id, "prod-deploy-failures-to-failure-callback", prod_deploy["id"], build_failure_callback["id"], ["Failure", "No Retry", "Retry"])
        ensure_connection(process_group_id, "preview-deploy-failures-to-failure-callback", preview_deploy["id"], build_failure_callback["id"], ["Failure", "No Retry", "Retry"])
        ensure_connection(process_group_id, "preview-destroy-failures-to-failure-callback", preview_destroy["id"], build_failure_callback["id"], ["Failure", "No Retry", "Retry"])
        ensure_connection(process_group_id, "prod-destroy-failures-to-failure-callback", prod_destroy["id"], build_failure_callback["id"], ["Failure", "No Retry", "Retry"])
        ensure_connection(process_group_id, "success-callback-to-finish-platform-operation", build_success_callback["id"], finish_succeeded["id"], ["success"])
        ensure_connection(process_group_id, "success-callback-failures-to-platform-deploy-dlq", build_success_callback["id"], dlq["id"], ["failure"])
        ensure_connection(process_group_id, "finish-success-failures-to-platform-deploy-dlq", finish_succeeded["id"], dlq["id"], ["Failure", "No Retry", "Retry"])
        ensure_connection(process_group_id, "failure-callback-to-finish-platform-operation", build_failure_callback["id"], finish_failed["id"], ["success"])
        ensure_connection(process_group_id, "failure-callback-failures-to-platform-deploy-dlq", build_failure_callback["id"], dlq["id"], ["failure"])
        ensure_connection(process_group_id, "finish-failed-original-to-platform-deploy-dlq", finish_failed["id"], dlq["id"], ["Original"])
        ensure_connection(process_group_id, "finish-failed-failures-to-platform-deploy-dlq", finish_failed["id"], dlq["id"], ["Failure", "No Retry", "Retry"])

      processors_to_start = [
        dlq,
        mark_running,
        set_auth,
        extract_metadata,
        consume,
      ]
      if PLATFORM_DEPLOY_EXECUTION_ENABLED:
        processors_to_start = [
          dlq,
          finish_failed,
          build_failure_callback,
          finish_succeeded,
          build_success_callback,
          route_after_destroy,
          prod_destroy,
          preview_destroy,
          preview_deploy,
          prod_deploy,
          route_operation_type,
          mark_running,
          set_auth,
          extract_metadata,
          consume,
        ]

      for processor in processors_to_start:
        set_processor_state(processor, "RUNNING")
      mode = "execution enabled" if PLATFORM_DEPLOY_EXECUTION_ENABLED else "handoff only"
      print(f"Platform deploy NiFi flow is configured and running in process group {process_group_id} ({mode}).")

    if __name__ == "__main__":
      main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-deploy-nifi-runtime-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "67"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-deploy-nifi-runtime-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-runtime-flow
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_API
              value: "https://nifi-0.nifi-hs.kafka.svc.cluster.local:8443/nifi-api"
            - name: NIFI_FLOW_NAME
              value: "platform-app-deploy"
            - name: NIFI_TLS_DIR
              value: "/nifi-tls"
            - name: KAFKA_CREDENTIALS_DIR
              value: "/kafka-credentials"
            - name: FLOW_SECRETS_DIR
              value: "/flow-secrets"
            - name: NIFI_PARAMETER_CONTEXT_NAME
              value: "platform-deploy-context"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: kafka_bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: kafka_security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: kafka_sasl_mechanism
            - name: PLATFORM_DEPLOY_PREPARED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: prepared_topic
            - name: PLATFORM_DEPLOY_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: dlq_topic
            - name: PLATFORM_DEPLOY_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: consumer_group
            - name: PLATFORM_DEPLOY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: platform_deploy_service_url
            - name: PLATFORM_DEPLOY_EXECUTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: platform_deploy_executor_url
            - name: PLATFORM_DEPLOY_EXECUTION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: platform-deploy-flow-config
                  key: execution_enabled
          command: ["python", "/bootstrap/bootstrap_flow.py"]
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
            - name: nifi-tls
              mountPath: /nifi-tls
              readOnly: true
            - name: kafka-credentials
              mountPath: /kafka-credentials
              readOnly: true
            - name: flow-secrets
              mountPath: /flow-secrets
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: platform-deploy-nifi-runtime-bootstrap
            defaultMode: 0555
        - name: nifi-tls
          secret:
            secretName: nifi-external-cluster-tls-auth
        - name: kafka-credentials
          secret:
            secretName: platform-deploy-kafka-credentials
        - name: flow-secrets
          secret:
            secretName: platform-deploy-flow-secrets
