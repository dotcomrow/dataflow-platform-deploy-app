      value: kafka.kafka.svc.internal.lan:9092
    - name: platform.kafka.security.protocol
      value: SASL_PLAINTEXT
    - name: platform.kafka.sasl.mechanism
      value: SCRAM-SHA-256
    - name: platform.deploy.prepared.topic
      value: batch.platform.deploy.prepared.v1
    - name: platform.deploy.dlq.topic
      value: batch.platform.deploy.prepared.dlq.v1
    - name: platform.deploy.consumer.group
      value: nifi-platform-deploy-prepared-v1
    - name: platform.deploy.service.url
      value: http://platform-deploy-service.directus.svc.cluster.local:8080
    - name: platform.deploy.executor.url
      value: http://platform-deploy-executor.directus.svc.cluster.local:8080
    - name: platform.deploy.execution.enabled
      value: "true"
---
