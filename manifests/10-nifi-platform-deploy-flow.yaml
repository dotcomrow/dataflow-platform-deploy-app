apiVersion: nifi.konpyutaika.com/v1
kind: NifiParameterContext
metadata:
  name: platform-deploy-context
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "63"
spec:
  description: "Parameters for platform app deployment orchestration"
  clusterRef:
    name: nifi-external
    namespace: dataflow
  secretRefs:
    - name: platform-deploy-kafka-credentials
      namespace: dataflow
  parameters:
