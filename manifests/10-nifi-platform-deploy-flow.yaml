        {
          "name": "extract-platform-deploy-metadata",
          "type": "org.apache.nifi.processors.standard.EvaluateJsonPath",
          "relationships": ["matched", "unmatched", "failure"]
        },
        {
          "name": "set-platform-deploy-authorization",
          "type": "org.apache.nifi.processors.attributes.UpdateAttribute",
          "relationships": ["success"]
        },
        {
          "name": "mark-platform-operation-running",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.service.url}/internal/operations/${platform.operation_id}/start",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "route-platform-operation-type",
          "type": "org.apache.nifi.processors.standard.RouteOnAttribute",
          "relationships": ["destroy", "recreate", "unmatched"]
        },
        {
          "name": "invoke-platform-prod-deploy",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.executor.url}/internal/operations/${platform.operation_id}/steps/prod-deploy",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "route-prod-deploy-success",
          "type": "org.apache.nifi.processors.standard.RouteOnAttribute",
          "relationships": ["succeeded", "unmatched"]
        },
        {
          "name": "invoke-platform-preview-deploy",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.executor.url}/internal/operations/${platform.operation_id}/steps/preview-deploy",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "invoke-platform-preview-destroy",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.executor.url}/internal/operations/${platform.operation_id}/steps/preview-destroy",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "invoke-platform-prod-destroy",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.executor.url}/internal/operations/${platform.operation_id}/steps/prod-destroy",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "route-platform-after-destroy",
          "type": "org.apache.nifi.processors.standard.RouteOnAttribute",
          "relationships": ["destroy_complete", "unmatched"]
        },
        {
          "name": "build-platform-deploy-success-callback",
          "type": "org.apache.nifi.processors.standard.ReplaceText",
          "relationships": ["success", "failure"]
        },
        {
          "name": "finish-platform-operation-succeeded",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.service.url}/internal/operations/${platform.operation_id}/finish",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "build-platform-deploy-failure-callback",
          "type": "org.apache.nifi.processors.standard.ReplaceText",
          "relationships": ["success", "failure"]
        },
        {
          "name": "finish-platform-operation-failed",
          "type": "org.apache.nifi.processors.standard.InvokeHTTP",
          "url": "#{platform.deploy.service.url}/internal/operations/${platform.operation_id}/finish",
          "relationships": ["Response", "Failure", "Retry", "No Retry", "Original"]
        },
        {
          "name": "publish-platform-deploy-dlq",
