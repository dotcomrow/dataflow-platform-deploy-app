apiVersion: batch/v1
kind: Job
metadata:
  name: platform-deploy-nifi-registry-bootstrap
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "65"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-deploy-nifi-registry-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-registry-flow
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_REGISTRY_API
              value: "http://nifi-registry.dataflow.svc.cluster.local:18080/nifi-registry-api"
            - name: NIFI_REGISTRY_BUCKET_ID
              value: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
            - name: NIFI_REGISTRY_FLOW_ID
              value: "46d4e1b6-e423-49c2-9b5f-636e9f12f171"
            - name: NIFI_REGISTRY_FLOW_NAME
              value: "platform-app-deploy"
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail

              check_http() {
                local method="$1"
                local url="$2"
                local body_file="${3:-}"
                local status=""
                if [ -n "${body_file}" ]; then
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" \
                    -H "Content-Type: application/json" "${url}" --data @"${body_file}" || true)"
                else
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" "${url}" || true)"
                fi
                echo "${status}"
              }

              echo "Waiting for NiFi Registry API..."
              ready="false"
              for _ in $(seq 1 120); do
                code="$(check_http GET "${NIFI_REGISTRY_API}/buckets")"
                if [ "${code}" = "200" ]; then
                  ready="true"
                  break
                fi
                sleep 2
              done
              if [ "${ready}" != "true" ]; then
                echo "NiFi Registry API is not ready."
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}")"
              if [ "${code}" != "200" ]; then
                echo "Registry bucket id not found: ${NIFI_REGISTRY_BUCKET_ID}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}")"
              if [ "${code}" = "404" ]; then
                cat > /tmp/flow.json <<EOF
              {
                "identifier": "${NIFI_REGISTRY_FLOW_ID}",
                "bucketIdentifier": "${NIFI_REGISTRY_BUCKET_ID}",
                "name": "${NIFI_REGISTRY_FLOW_NAME}",
                "description": "Platform app deployment orchestration flow"
              }
              EOF
                code="$(check_http POST "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows" /tmp/flow.json)"
                if [ "${code}" != "200" ] && [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
                  echo "Failed creating Registry flow: HTTP ${code}"
                  cat /tmp/resp.json || true
                  exit 1
                fi
              elif [ "${code}" != "200" ]; then
                echo "Unexpected response checking Registry flow: HTTP ${code}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}")"
              if [ "${code}" != "200" ]; then
                echo "Registry flow was not found after bootstrap: ${NIFI_REGISTRY_FLOW_ID}"
                cat /tmp/resp.json || true
                exit 1
              fi

              for version in 1 2 3; do
                version_url="${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}/versions/${version}"
                code="$(check_http GET "${version_url}")"
                if [ "${code}" = "200" ]; then
                  echo "Flow version ${version} already exists."
                  continue
                fi
                if [ "${code}" != "404" ]; then
                  echo "Unexpected response checking flow version ${version}: HTTP ${code}"
                  cat /tmp/resp.json || true
                  exit 1
                fi

                sed "s/\"__FLOW_VERSION__\"/${version}/" \
                  /snapshot/flow-template.json > "/tmp/flow-v${version}.json"
                code="$(check_http POST \
                  "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}/versions" \
                  "/tmp/flow-v${version}.json")"
                if [ "${code}" != "200" ] && [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
                  echo "Failed creating flow version ${version}: HTTP ${code}"
                  cat /tmp/resp.json || true
                  exit 1
                fi
              done
          volumeMounts:
            - name: flow-snapshot
              mountPath: /snapshot
              readOnly: true
      volumes:
        - name: flow-snapshot
          configMap:
            name: platform-deploy-flow-snapshot
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiDataflow
metadata:
