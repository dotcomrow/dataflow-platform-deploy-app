  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "66"
spec:
  displayName: "platform-app-deploy"
  bucketId: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
  flowId: "46d4e1b6-e423-49c2-9b5f-636e9f12f171"
  flowVersion: 3
  flowPosition:
    posX: 800
    posY: 1
  syncMode: always
  updateStrategy: drain
  skipInvalidControllerService: true
  skipInvalidComponent: true
  clusterRef:
    name: nifi-external
    namespace: dataflow
  registryClientRef:
    name: platform-deploy-flow-registry
    namespace: dataflow
  parameterContextRef:
    name: platform-deploy-context
    namespace: dataflow
